name: NEET Counselling Website Monitor

# WHEN THIS RUNS:
# 1. Automatically every 15 minutes (the cron schedule below)
# 2. Manually, any time you click "Run workflow" in the Actions tab
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Send a test WhatsApp/email message right now (yes/no)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# The workflow needs permission to commit the updated "snapshot" files
# back to this repository, so it remembers what the websites looked like
# last time it checked.
permissions:
  contents: write

# If a run somehow takes too long or overlaps with the next scheduled
# run, this makes sure only one check happens at a time.
concurrency:
  group: neet-counselling-monitor
  cancel-in-progress: false

jobs:
  check-websites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run the website monitor
        env:
          # --- Email (Gmail) secrets ---
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL_1: ${{ secrets.RECIPIENT_EMAIL_1 }}
          RECIPIENT_EMAIL_2: ${{ secrets.RECIPIENT_EMAIL_2 }}
          RECIPIENT_EMAIL_3: ${{ secrets.RECIPIENT_EMAIL_3 }}
          # --- WhatsApp (CallMeBot) secrets, one pair per person ---
          WHATSAPP_PHONE_1: ${{ secrets.WHATSAPP_PHONE_1 }}
          WHATSAPP_APIKEY_1: ${{ secrets.WHATSAPP_APIKEY_1 }}
          WHATSAPP_PHONE_2: ${{ secrets.WHATSAPP_PHONE_2 }}
          WHATSAPP_APIKEY_2: ${{ secrets.WHATSAPP_APIKEY_2 }}
          WHATSAPP_PHONE_3: ${{ secrets.WHATSAPP_PHONE_3 }}
          WHATSAPP_APIKEY_3: ${{ secrets.WHATSAPP_APIKEY_3 }}
          # Only force a test message when someone manually runs the
          # workflow and asks for one; scheduled runs never force it.
          SEND_TEST_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_message || 'false' }}
        run: python monitor.py

      - name: Save updated snapshots back to the repository
        run: |
          git config user.name "neet-counselling-monitor-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No snapshot changes to save."
          else
            git commit -m "Update website snapshots [skip ci]"
            git push
          fi
